name: CI

on:
  push:
    branches: [main, 'top-*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test --exclude-tags golden

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      # package info, signatures and alignment of what gets installed
      - name: Check APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          apk=build/app/outputs/flutter-apk/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $bt"
          "$bt"/aapt2 dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application:|launchable-activity|native-code)"
          "$bt"/apksigner verify --verbose --print-certs "$apk"
          "$bt"/zipalign -c -P 16 4 "$apk" && echo "zipalign: ok"
          unzip -l "$apk" | grep -E "AndroidManifest|classes|lib/|mipmap-anydpi" | head -20

      - uses: actions/upload-artifact@v7
        with:
          name: topview-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign
