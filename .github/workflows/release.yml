name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      # TOP: sign with topview's key, so a new APK installs over the old one. The key is in the repo encrypted
      # (android/app/topview.jks.enc), its passphrase in Settings > Secrets > Actions > TOPVIEW_KEY_PASSPHRASE.
      # Without the secret (forks, dependabot) a throwaway key, through the same signing setup (like the debug key,
      # its APKs don't install over each other). Check APK below shows which: CN=topview or CN=throwaway.
      - name: Signing key
        env:
          PASSPHRASE: ${{ secrets.TOPVIEW_KEY_PASSPHRASE }}
        run: |
          if [ -n "$PASSPHRASE" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/app/topview.jks.enc -out android/app/topview.jks -pass env:PASSPHRASE
            echo "topview key"
          else
            PASSPHRASE="throwaway$RANDOM$RANDOM$RANDOM"
            keytool -genkeypair -keystore android/app/topview.jks -storetype PKCS12 -alias topview -keyalg RSA -keysize 2048 \
              -validity 3650 -dname "CN=throwaway" -storepass "$PASSPHRASE" -keypass "$PASSPHRASE" > /dev/null
            echo "no TOPVIEW_KEY_PASSPHRASE secret: throwaway key"
          fi
          printf 'storeFile=topview.jks\nstorePassword=%s\nkeyAlias=topview\nkeyPassword=%s\n' "$PASSPHRASE" "$PASSPHRASE" > android/key.properties

      - run: flutter build apk --release

      - name: Rename APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "topview-${version}.apk"

      - name: Generate changelog
        id: changelog
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "")
          if [ -n "$prev_tag" ]; then
            log=$(git log --pretty=format:'- %s' "${prev_tag}..${GITHUB_REF_NAME}^")
          else
            log="- Initial release"
          fi
          {
            echo 'body<<EOF'
            echo "$log"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.body }}

            ## Download

            - **topview-${{ github.ref_name }}.apk** — Universal Android APK (sideload)
          files: topview-*.apk
